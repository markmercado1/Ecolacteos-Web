rva.',api:'GET/POST /api/admin/precios-litro'}};
    const state={page:'dashboard',zone:'Huancayo Norte',providerZone:'Todas las zonas',providerStatus:'Todos',providerSearch:'',providerPage:1,paymentTab:'pagos',catalogTab:'Zonas',auditTab:'Acopio',route:[{name:'Máximo Quispe Rojas',code:'PRV-0142',time:'07:30'},{name:'Rosa Huamán Ticse',code:'PRV-0087',time:'08:15'},{name:'Teodora Lázaro Pari',code:'PRV-0056',time:'09:00'}]};
    const routeByZone={'Huancayo Norte':state.route,'El Tambo':[{name:'Fidel Ccanto Aliaga',code:'PRV-0231',time:'08:00'},{name:'Elena Poma Salazar',code:'PRV-0314',time:'08:45'}],Chilca:[]};
    const providers=[{id:'PRV-0142',name:'Máximo Quispe Rojas',zone:'Huancayo Norte',liters:'1,286 L',status:'Activo',phone:'987 456 210'},{id:'PRV-0087',name:'Rosa Huamán Ticse',zone:'Huancayo Norte',liters:'1,104 L',status:'Activo',phone:'954 221 078'},{id:'PRV-0231',name:'Fidel Ccanto Aliaga',zone:'El Tambo',liters:'948 L',status:'Activo',phone:'988 107 662'},{id:'PRV-0056',name:'Teodora Lázaro Pari',zone:'Huancayo Norte',liters:'812 L',status:'Activo',phone:'945 122 368'},{id:'PRV-0198',name:'Julián Mendoza Ríos',zone:'Chilca',liters:'0 L',status:'Inactivo',phone:'933 074 652'},{id:'PRV-0314',name:'Elena Poma Salazar',zone:'El Tambo',liters:'1,015 L',status:'Activo',phone:'962 070 144'}];
    const payments=[{id:'PAG-2048',name:'Máximo Quispe Rojas',week:'01–07 sep 2026',liters:'1,286 L',total:'S/ 2,958.00',status:'Comprobante generado'},{id:'PAG-2047',name:'Rosa Huamán Ticse',week:'01–07 sep 2026',liters:'1,104 L',total:'S/ 2,539.20',status:'Pendiente de comprobante'},{id:'PAG-2046',name:'Fidel Ccanto Aliaga',week:'01–07 sep 2026',liters:'948 L',total:'S/ 2,180.40',status:'Comprobante generado'},{id:'PAG-2045',name:'Teodora Lázaro Pari',week:'01–07 sep 2026',liters:'812 L',total:'S/ 1,867.60',status:'Comprobante generado'}];
    const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const badge=(text,type='')=>`<span class="badge ${type}">${esc(text)}</span>`;

    const note=(txt='')=>`<div class="module-note">${icon('activity')}<div><b>Conexión prevista:</b> ${esc(pages[state.page].api)}${txt?' · '+txt:''}</div></div>`;
    const foot=(text='Datos ilustrativos')=>`<div class="table-foot"><span>${text}</span><div class="pagination"><button class="page-btn" type="button" data-action="page-prev" aria-label="Página anterior">‹</button><button class="page-btn active" type="button">${state.providerPage}</button><button class="page-btn" type="button" data-action="page-next" aria-label="Página siguiente">›</button></div></div>`;
    const opt=(options,current)=>options.map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(x)}</option>`).join('');
    const zones=['Huancayo Norte','El Tambo','Chilca'];
    function dashboard(){const v=state.zone==='Huancayo Norte'?['S/ 12,840','38,420 L','6.8%','S/ 46,230']:state.zone==='El Tambo'?['S/ 8,560','24,910 L','5.4%','S/ 31,480']:['S/ 6,410','17,760 L','7.2%','S/ 22,650'];return `${head(`<select class="select" id="zone-select" aria-label="Seleccionar zona">${opt(zones,state.zone)}</select><button class="btn" data-page="auditoria">Ver operación ${icon('arrow')}</button>`,'RESUMEN POR ZONA')}
      <div class="hero"><div><div class="eyebrow">ENFOQUE DE LA SEMANA</div><h2>De la recolección a una mejor decisión.</h2><p>Prioriza alertas y revisa el pronóstico antes de planear rutas, liquidaciones y producción.</p></div><button class="btn" data-page="rutas">Planear una ruta ${icon('arrow')}</button></div>
      <div class="grid grid-4"><div class="card metric-card tinted"><div class="metric-icon">${icon('activity')}</div><div class="label">Leche en riesgo valorizada</div><div class="value">${v[0]}</div><div class="delta warn">Revisar alertas de calidad</div></div><div class="card metric-card"><div class="metric-icon">${icon('clock')}</div><div class="label">Pronóstico de entregas · semana</div><div class="value">${v[1]}</div><div class="delta">Proyección del último cálculo</div></div><div class="card metric-card"><div class="metric-icon">${icon('leaf')}</div><div class="label">Rechazo simulado · score +10</div><div class="value">${v[2]}</div><div class="delta">Escenario, no resultado real</div></div><div class="card metric-card"><div class="metric-icon">${icon('pagos')}</div><div class="label">Ventas por canal · muestra</div><div class="value">${v[3]}</div><div class="delta">Suma ilustrativa de canales</div></div></div>
      <div class="section-head"><h2>Indicadores de la zona</h2><span>Semana referencial · 07–13 sep</span></div><div class="split"><div class="card card-pad"><div class="chart-title">Entregas y proyección</div><div class="chart-sub">Visualización conceptual del volumen diario · litros</div><div class="chart-wrap">${[['Lun',52,64],['Mar',68,73],['Mié',61,69],['Jue',76,80],['Vie',73,86],['Sáb',80,89],['Dom',56,72]].map(a=>`<div class="bar-group"><div class="bar" style="height:${a[1]}%"></div><div class="bar dark" style="height:${a[2]}%"></div><span>${a[0]}</span></div>`).join('')}</div><div class="chart-legend"><span><i></i>Acopiado</span><span><i class="dark"></i>Pronóstico</span></div></div><div class="card card-pad"><div class="chart-title">Ventas por canal</div><div class="chart-sub">Total de ventas ilustrativo, no margen neto</div>${[['Mayorista','S/ 26,210',76],['Público','S/ 12,840',46],['Proveedor','S/ 7,180',28]].map(a=>`<div class="channel"><div class="channel-head"><b>${a[0]}</b><span>${a[1]}</span></div><div class="channel-track"><i style="width:${a[2]}%"></i></div></div>`).join('')}<div class="insight"><b>Lectura útil:</b> el panel económico real responde por zona. Para un total de toda la empresa haría falta una agregación adicional.</div></div></div>
      <div class="section-head"><h2>Señales que requieren atención</h2><button class="btn small" data-page="auditoria">Abrir supervisión ${icon('arrow')}</button></div><div class="grid grid-2"><div class="card card-pad"><div class="list-item"><div class="list-dot">!</div><div><strong>Volumen atípico · PRV-0231</strong><p>Comparar con sus entregas anteriores antes de contactar al productor.</p></div><time>Hoy</time></div><div class="list-item"><div class="list-dot">!</div><div><strong>Riesgo de adulteración · PRV-0087</strong><p>Revisar la muestra vinculada al registro de acopio.</p></div><time>Ayer</time></div></div><div class="card card-pad"><div class="list-item"><div class="list-dot green">↗</div><div><strong>4 ajustes pendientes de liquidación</strong><p>Las correcciones posteriores al pago conservan trazabilidad propia.</p><button class="btn small" data-page="pagos">Ver ajustes ${icon('arrow')}</button></div></div></div></div>${note('El gráfico diario es ilustrativo; el endpoint económico no entrega una serie diaria.')}`}
    function proveedores(){let rows=providers.filter(p=>(state.providerZone==='Todas las zonas'||p.zone===state.providerZone)&&(state.providerStatus==='Todos'||p.status===state.providerStatus)&&(!state.providerSearch||`${p.name} ${p.id}`.toLowerCase().includes(state.providerSearch.toLowerCase())));return `${head(`<button class="btn primary" data-drawer="new-provider">${icon('plus')} Nuevo proveedor</button>`,'PADRÓN PRODUCTIVO')}<div class="grid grid-4" style="margin-bottom:17px"><div class="card metric-card"><div class="label">Productores registrados</div><div class="value">248</div><div class="delta">Todas las zonas</div></div><div class="card metric-card"><div class="label">Productores activos</div><div class="value">231</div><div class="delta">Disponibles para acopio</div></div><div class="card metric-card"><div class="label">Zonas operativas</div><div class="value">03</div><div class="delta">Administradas desde catálogos</div></div><div class="card metric-card tinted"><div class="label">Litros de muestra · semana</div><div class="value">5,165 L</div><div class="delta">Solo filas ilustrativas visibles</div></div></div>
      <div class="card table-card"><div class="table-toolbar"><div><h2>Directorio de proveedores</h2><p>Filtra por zona y estado; abre un perfil para ver su historial.</p></div><div class="filters"><div class="search">${icon('search')}<input id="provider-search" placeholder="Buscar en esta muestra" value="${esc(state.providerSearch)}" aria-label="Buscar en los datos ilustrativos"></div><select id="provider-zone" class="select" aria-label="Filtrar zona">${opt(['Todas las zonas',...zones],state.providerZone)}</select><select id="provider-status" class="select" aria-label="Filtrar estado">${opt(['Todos','Activo','Inactivo'],state.providerStatus)}</select></div></div><div class="table-scroll"><table><thead><tr><th>Proveedor</th><th>Zona actual</th><th>Volumen de muestra</th><th>Estado</th><th></th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${p.id}</small></td><td>${p.zone}</td><td>${p.liters}</td><td>${badge(p.status,p.status==='Activo'?'':'gray')}</td><td><button class="row-link" data-detail="provider:${p.id}">Ver perfil →</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No hay proveedores que coincidan en esta muestra.</td></tr>`}</tbody></table></div>${foot(`${rows.length} resultados en el prototipo · el backend pagina con contenido y totalElementos`)}</div>${note('La API filtra por zonaId y activo; la búsqueda por nombre requeriría un parámetro nuevo o una búsqueda local acotada.')}`}
    function pagos(){return `${head(`<button class="btn primary" data-drawer="generate-payment">${icon('plus')} Generar pago</button>`,'CONTROL FINANCIERO')}<div class="hero compact"><div><div class="eyebrow">PENDIENTE DE RESOLVER</div><h2>4 ajustes esperan liquidación</h2><p>Una corrección posterior al pago produce un ajuste auditable. El pago original no cambia.</p></div><button class="btn" data-tab="payment:ajustes">Revisar ajustes ${icon('arrow')}</button></div><div class="grid grid-3" style="margin-bottom:17px"><div class="card metric-card"><div class="label">Liquidaciones · muestra</div><div class="value">S/ 9,545</div><div class="delta">Cuatro pagos ilustrativos</div></div><div class="card metric-card"><div class="label">Pagos de muestra</div><div class="value">04</div><div class="delta">Semana 01–07 sep 2026</div></div><div class="card metric-card tinted"><div class="label">Ajustes por revisar</div><div class="value">04</div><div class="delta warn">Acción administrativa</div></div></div><div class="card table-card"><div class="tabs"><button class="tab ${state.paymentTab==='pagos'?'active':''}" data-tab="payment:pagos">Liquidaciones</button><button class="tab ${state.paymentTab==='ajustes'?'active':''}" data-tab="payment:ajustes">Ajustes pendientes</button></div>${state.paymentTab==='pagos'?`<div class="table-toolbar"><div><h2>Historial de pagos</h2><p>Detalle de entregas liquidadas y comprobante.</p></div><button class="btn small" data-drawer="generate-payment">${icon('plus')} Nuevo pago</button></div><div class="table-scroll"><table><thead><tr><th>Proveedor / pago</th><th>Semana</th><th>Litros liquidados</th><th>Importe</th><th>Comprobante</th><th></th></tr></thead><tbody>${payments.map(p=>`<tr><td><strong>${p.name}</strong><small>${p.id}</small></td><td>${p.week}</td><td>${p.liters}</td><td><strong>${p.total}</strong></td><td>${badge(p.status,p.status.startsWith('Pendiente')?'amber':'')}</td><td><button class="row-link" data-detail="payment:${p.id}">Ver detalle →</button></td></tr>`).join('')}</tbody></table></div>${foot('4 pagos ilustrativos · GET /api/pagos devuelve una lista')}`:`<div class="table-toolbar"><div><h2>Correcciones por saldar</h2><p>La consulta real se hace por proveedor seleccionado.</p></div><select id="adjust-provider" class="select" aria-label="Proveedor de los ajustes"><option>Máximo Quispe Rojas</option><option>Rosa Huamán Ticse</option></select></div><div class="table-scroll"><table><thead><tr><th>Ajuste</th><th>Registro vinculado</th><th>Motivo</th><th>Diferencia</th><th>Estado</th><th></th></tr></thead><tbody><tr><td><strong>AJ-1028</strong><small>Generado 10 sep</small></td><td>AC-4821</td><td>Corrección de litros</td><td><strong>+ S/ 27.60</strong></td><td>${badge('Pendiente','amber')}</td><td><button class="row-link" data-detail="adjust:AJ-1028">Revisar →</button></td></tr><tr><td><strong>AJ-1027</strong><small>Generado 09 sep</small></td><td>AC-4804</td><td>Corrección de litros</td><td><strong>− S/ 16.10</strong></td><td>${badge('Pendiente','amber')}</td><td><button class="row-link" data-detail="adjust:AJ-1027">Revisar →</button></td></tr></tbody></table></div><div class="table-foot">Dos ajustes ilustrativos del proveedor seleccionado.</div>`}</div>${note('Generar pago requiere proveedorId, semanaInicio y semanaFin. Los ajustes pendientes requieren proveedorId.')}`}
    function rutas(){return `${head(`<select id="route-zone" class="select" aria-label="Seleccionar zona">${opt(zones,state.zone)}</select><button class="btn primary" data-action="save-route">Guardar ruta completa ${icon('arrow')}</button>`,'ORGANIZACIÓN DE CAMPO')}<div class="hero compact"><div><div class="eyebrow">RUTA DE ${state.zone.toUpperCase()}</div><h2>${state.route.length} paradas en un mismo recorrido</h2><p>El orden se publica de una vez. Revisa todos los puntos antes de guardar.</p></div><button class="btn" data-drawer="add-stop">${icon('plus')} Añadir parada</button></div><div class="route-layout"><div class="card"><div class="table-toolbar"><div><h2>Orden de visita</h2><p>Usa las flechas para reorganizar la secuencia de ejemplo.</p></div>${badge('Borrador visual','blue')}</div><div class="route-list">${state.route.map((s,i)=>`<div class="route-stop"><div class="route-num">${String(i+1).padStart(2,'0')}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.code)} · Hora estimada ${esc(s.time)}</small></div><div class="route-control"><button data-move="${i}:-1" ${i===0?'disabled':''} aria-label="Subir ${esc(s.name)}">↑</button><button data-move="${i}:1" ${i===state.route.length-1?'disabled':''} aria-label="Bajar ${esc(s.name)}">↓</button></div></div>`).join('')}</div></div><div class="card route-visual"><div class="chart-title">Vista de recorrido</div><div class="chart-sub">Esquema ilustrativo · sin geolocalización de ruta</div><div class="route-map"><svg viewBox="0 0 300 320" preserveAspectRatio="none"><path d="M40 260 Q65 230 88 220 T136 176 T208 124 T254 52" stroke="#28644b" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="8 7"/>${[[40,260],[88,220],[136,176],[208,124]].slice(0,state.route.length).map((xy,i)=>`<circle cx="${xy[0]}" cy="${xy[1]}" r="14" fill="#17382e"/><text x="${xy[0]}" y="${xy[1]+4}" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">${i+1}</text>`).join('')}</svg></div><div class="route-caption">El backend guarda orden y hora estimada. La geometría del mapa es solo una representación de diseño.</div></div></div>${note('PUT reemplaza toda la ruta de la zona. Cada proveedor debe pertenecer actualmente a esa zona.')}`}
    function comunicados(){return `${head(`<button class="btn" data-detail="communication:COM-092">Ver confirmaciones ${icon('arrow')}</button>`,'COMUNICACIÓN TERRITORIAL')}<div class="compose"><div class="card card-pad"><div class="eyebrow">NUEVO COMUNICADO</div><h2 class="chart-title" style="margin:9px 0 18px">Redacta un mensaje para campo</h2><div class="field"><label for="message">Mensaje</label><textarea id="message" placeholder="Escribe la información que el acopiador compartirá con los productores..."></textarea></div><div class="field"><label>Zonas destinatarias</label><div class="checklist">${zones.map((z,i)=>`<label class="check"><input type="checkbox" class="zone-check" ${i===0?'checked':''}>${z}</label>`).join('')}</div></div><div class="drawer-info">La confirmación se registra cuando el acopiador comunica el mensaje a un proveedor. Publicar no equivale a confirmar su entrega.</div><button class="btn primary" data-action="publish-message">Publicar comunicado ${icon('arrow')}</button></div><div class="card card-pad"><div class="eyebrow">VISTA PREVIA</div><div class="preview" style="margin-top:13px"><span>ECOLÁCTEOS · COMUNICADO</span><p id="message-preview">Tu comunicado aparecerá aquí mientras lo escribes.</p><small>Destino: zonas seleccionadas · Visible para los equipos operativos</small></div><div class="section-head"><h2>Publicados recientemente</h2><span>Datos de ejemplo</span></div><div class="list-item"><div class="list-dot green">✉</div><div><strong>Actualización de horario de recepción</strong><p>Huancayo Norte y El Tambo · 12 sep 2026</p><button class="row-link" data-detail="communication:COM-092">Ver confirmaciones →</button></div></div><div class="list-item"><div class="list-dot green">✉</div><div><strong>Control preventivo de calidad</strong><p>Chilca · 09 sep 2026</p></div></div></div></div>${note('POST envía mensaje y zonaIds; GET lista todos los comunicados para ADMIN.')}`}
    function usuarios(){let people=[['Ana María Torres','ana.torres@ecolacteos.pe','ADMIN','Activo'],['Jorge Palomino','jorge.palomino@ecolacteos.pe','ACOPIADOR','Activo'],['Lucía Salazar','lucia.salazar@ecolacteos.pe','CALIDAD','Activo'],['Carlos Lazo','carlos.lazo@ecolacteos.pe','RECEPCION','Activo'],['Mónica Rojas','monica.rojas@ecolacteos.pe','PRODUCCION','Inactivo'],['Diego Huamán','diego.huaman@ecolacteos.pe','VENTAS','Activo']];return `${head(`<button class="btn primary" data-drawer="new-user">${icon('plus')} Nuevo usuario</button>`,'CONTROL DE ACCESO')}<div class="grid grid-3" style="margin-bottom:17px"><div class="card metric-card"><div class="label">Usuarios de muestra</div><div class="value">06</div><div class="delta">Cinco activos</div></div><div class="card metric-card"><div class="label">Roles disponibles</div><div class="value">06</div><div class="delta">Catálogo de roles del servidor</div></div><div class="card metric-card tinted"><div class="label">Acceso desactivado</div><div class="value">01</div><div class="delta">Puede reactivarse por ADMIN</div></div></div><div class="card table-card"><div class="table-toolbar"><div><h2>Equipo y permisos</h2><p>Los permisos efectivos dependen del rol asignado.</p></div><button class="btn small" data-drawer="new-user">${icon('plus')} Añadir persona</button></div><div class="table-scroll"><table><thead><tr><th>Nombre</th><th>Correo de acceso</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>${people.map((p,i)=>`<tr><td><strong>${p[0]}</strong></td><td>${p[1]}</td><td><strong>${p[2]}</strong></td><td>${badge(p[3],p[3]==='Activo'?'':'gray')}</td><td><button class="row-link" data-detail="user:${i}">Ver acceso →</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot">GET /api/admin/usuarios devuelve una lista de usuarios.</div></div>${note('ADMIN puede crear, editar, desactivar y reactivar usuarios; GET /api/admin/roles alimenta el selector.')}`}
    const catalogData={Zonas:{endpoint:'/api/admin/zonas',columns:['Zona','Estado','Acción'],rows:[['Huancayo Norte','Activa','Ver zona'],['El Tambo','Activa','Ver zona'],['Chilca','Activa','Ver zona']]},Unidades:{endpoint:'/api/admin/unidades',columns:['Unidad','Responsable','Zona'],rows:[['W6P-814','Jorge Palomino','Huancayo Norte'],['C4H-221','Lidia Espinoza','El Tambo'],['ATN-903','Martín Córdova','Chilca']]},Motivos:{endpoint:'/api/admin/motivos-observacion',columns:['Motivo','Uso','Estado'],rows:[['Envase no conforme','Observación de acopio','Activo'],['Temperatura elevada','Observación de acopio','Activo'],['Diferencia de volumen','Observación de acopio','Activo']]},'Tipos de queso':{endpoint:'/api/admin/tipos-queso',columns:['Tipo','Ciclo de capital','Rendimiento esperado'],rows:[['Fresco','RÁPIDO','12.5 %'],['Paria','RÁPIDO','11.8 %'],['Madurado','MADURACION','10.2 %']]},Configuración:{endpoint:'/api/admin/configuracion',columns:['Parámetro','Valor','Descripción'],rows:[['UMBRAL_CONCILIACION_PCT','5','Diferencia permitida'],['CAPACIDAD_PROCESAMIENTO_DIARIA_LITROS','12000','Capacidad de planta'],['UMBRAL_ANOMALIA_Z_SCORE','2.5','Sensibilidad de alertas']]}};
    function catalogos(){let d=catalogData[state.catalogTab];return `${head(`<button class="btn primary" data-drawer="new-catalog">${icon('plus')} ${state.catalogTab==='Configuración'?'Editar parámetro':'Nuevo registro'}</button>`,'REFERENCIAS DEL SISTEMA')}<div class="card table-card"><div class="tabs">${Object.keys(catalogData).map(t=>`<button class="tab ${state.catalogTab===t?'active':''}" data-tab="catalog:${esc(t)}">${t}</button>`).join('')}</div><div class="table-toolbar"><div><h2>${state.catalogTab}</h2><p>Fuente: ${d.endpoint}</p></div><button class="btn small" data-drawer="new-catalog">${icon('plus')} ${state.catalogTab==='Configuración'?'Editar valor':'Agregar'}</button></div><div class="table-scroll"><table><thead><tr>${d.columns.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===0?`<strong>${v}</strong>`:esc(v)}</td>`).join('')}<td><button class="row-link" data-detail="catalog:${i}">Abrir →</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot">Datos ilustrativos · ${state.catalogTab==='Configuración'?'las claves son fijas; solo se modifica su valor':'los catálogos alimentan formularios móviles y web'}</div></div>${note('Las listas de zonas, motivos y tipos de queso devuelven solo activos; para reactivar uno ya inactivo hace falta conocer su id o ampliar la consulta del backend.')}`}
    function precios(){return `${head(`<button class="btn primary" data-drawer="new-price">${icon('plus')} Registrar nuevo precio</button>`,'POLÍTICA COMERCIAL')}<div class="price-hero"><div><div class="eyebrow">PRECIO DE REFERENCIA · EJEMPLO</div><div class="big">S/ 2.30 <small>/ litro</small></div><p>Vigente desde el 01 de septiembre de 2026 · valor ilustrativo</p></div><button class="btn" data-drawer="new-price">Definir nueva vigencia ${icon('arrow')}</button></div><div class="card table-card"><div class="table-toolbar"><div><h2>Historial de vigencias</h2><p>La nueva fecha y el nuevo precio se añaden a la serie.</p></div>${badge('Historial inmutable','blue')}</div><div class="table-scroll"><table><thead><tr><th>Vigente desde</th><th>Precio / litro</th><th>Estado de ejemplo</th><th></th></tr></thead><tbody>${[['01 sep 2026','S/ 2.30','Vigente'],['01 jul 2026','S/ 2.20','Anterior'],['01 may 2026','S/ 2.15','Anterior'],['01 mar 2026','S/ 2.10','Anterior']].map((r,i)=>`<tr><td><strong>${r[0]}</strong></td><td><strong>${r[1]}</strong></td><td>${badge(r[2],i?'gray':'')}</td><td><button class="row-link" data-detail="price:${i}">Ver registro →</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot">Cuatro vigencias ilustrativas · la API no ofrece PUT ni DELETE para precios.</div></div>${note('Un precio nuevo abre una vigencia. La API rechaza una fecha vigenteDesde duplicada.')}`}
    const auditData={Acopio:{columns:['Registro','Proveedor','Fecha / hora','Litros','Análisis',''],rows:[['AC-4821','Máximo Quispe Rojas','12 sep · 07:42','86.5 L','Pendiente','Ver registro'],['AC-4820','Rosa Huamán Ticse','12 sep · 07:30','74 L','Analizado','Ver registro'],['AC-4819','Fidel Ccanto Aliaga','12 sep · 07:14','65 L','Pendiente','Ver registro']]},Recepción:{columns:['Recepción','Unidad','Fecha','Litros planta','Estado',''],rows:[['REC-210','W6P-814','12 sep 2026','1,024 L','Conciliada','Ver detalle'],['REC-209','C4H-221','11 sep 2026','940 L','Revisar','Ver detalle']]},Producción:{columns:['Lote','Tipo de queso','Fecha','Litros usados','Unidades',''],rows:[['LOT-381','Fresco','12 sep 2026','740 L','92','Ver detalle'],['LOT-380','Paria','11 sep 2026','680 L','78','Ver detalle']]},Ventas:{columns:['Venta','Canal','Fecha','Cantidad','Total de muestra',''],rows:[['VEN-1281','Mayorista','12 sep 2026','48','S/ 1,152','Ver detalle'],['VEN-1280','Público','11 sep 2026','12','S/ 324','Ver detalle']]}};
    function auditoria(){let d=auditData[state.auditTab];return `${head(`<button class="btn" data-page="dashboard">Volver al panel ${icon('arrow')}</button>`,'TRAZABILIDAD')}<div class="hero compact"><div><div class="eyebrow">VISIBILIDAD ADMINISTRATIVA</div><h2>Lo capturado en campo, conectado con planta.</h2><p>Consulta registros y abre sus detalles. Las escrituras operativas se realizan en la app móvil.</p></div></div><div class="card table-card"><div class="tabs">${Object.keys(auditData).map(t=>`<button class="tab ${state.auditTab===t?'active':''}" data-tab="audit:${t}">${t}</button>`).join('')}</div><div class="table-toolbar"><div><h2>${state.auditTab==='Acopio'?'Registros de acopio':state.auditTab}</h2><p>${state.auditTab==='Acopio'?'GET /api/registros-acopio?fecha=&zonaId=&sinAnalisis=':state.auditTab==='Recepción'?'GET /api/recepcion-planta?unidadId=&fecha=&page=&size=':state.auditTab==='Producción'?'GET /api/lotes-produccion?fecha=&tipoQuesoId=&page=&size=':'GET /api/ventas?fecha=&tipoCliente=&page=&size='}</p></div><div class="filters"><input class="input" aria-label="Fecha de consulta" type="date"><button class="btn small" data-action="demo-filter">${icon('filter')} Aplicar</button></div></div><div class="table-scroll"><table><thead><tr>${d.columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${d.rows.map((r,i)=>`<tr>${r.slice(0,-1).map((v,j)=>`<td>${j===0?`<strong>${esc(v)}</strong>`:j===4&&state.auditTab==='Acopio'?badge(v,v==='Pendiente'?'amber':''):esc(v)}${j===0?'<small>Dato ilustrativo</small>':''}</td>`).join('')}<td><button class="row-link" data-detail="audit:${i}">Ver detalle →</button></td></tr>`).join('')}</tbody></table></div>${foot('Datos ilustrativos · recepción, producción y ventas usan PaginaResponse; acopio devuelve lista')}</div>${note('Análisis de calidad se consulta por folio o por registro de acopio; no hay un listado global de análisis.')}`}
    const renderers={dashboard,auditoria,proveedores,pagos,rutas,comunicados,usuarios,catalogos,precios};
    function render(){document.getElementById('content').innerHTML=renderers[state.page]();document.getElementById('crumb-title').textContent=pages[state.page].name;document.querySelectorAll('.nav-item').forEach(el=>{let p=el.dataset.page;el.classList.toggle('active',p===state.page);el.innerHTML=icon(p)+`<span>${pages[p].name}</span>`+(p==='pagos'?'<span class="count">4</span>':'')});document.title=`${pages[state.page].name} · EcoLácteos`;document.getElementById('app').classList.remove('menu-open')}
    const field=(label,type='text',placeholder='',value='')=>`<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`;
    const selectField=(label,choices)=>`<div class="field"><label>${label}</label><select>${choices.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
    function drawer(title,subtitle,body,cta='Guardar cambios',readOnly=false){document.getElementById('portal').innerHTML=`<div class="overlay" id="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div><div class="eyebrow">${readOnly?'DETALLE':'FORMULARIO DE EJEMPLO'}</div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close" data-action="close" aria-label="Cerrar">×</button></div><div class="drawer-body">${body}</div><div class="drawer-foot"><button class="btn" data-action="close">Cerrar</button>${readOnly?'':`<button class="btn primary" data-action="demo-save">${cta} ${icon('arrow')}</button>`}</div></section></div>`;document.querySelector('.drawer .close').focus()}
    function openForm(kind){let title='',subtitle='Vista previa del flujo administrativo; no se enviarán datos.',body='',cta='Guardar cambios';switch(kind){case'new-provider':title='Nuevo proveedor';body=field('Nombre completo','text','Nombre y apellidos')+field('DNI','text','Documento de identidad')+field('Teléfono','tel','Número de contacto')+selectField('Zona actual',zones)+`<div class="drawer-info">El código QR y el identificador los genera el backend al crear el proveedor.</div>`;cta='Crear proveedor';break;case'generate-payment':title='Generar liquidación';body=selectField('Proveedor',providers.filter(p=>p.status==='Activo').map(p=>p.name))+field('Inicio de semana','date')+field('Fin de semana','date')+`<div class="drawer-info">El servidor calcula los litros, aplica el precio vigente y rechaza semanas duplicadas o entregas ya liquidadas.</div>`;cta='Generar pago';break;case'add-stop':title='Añadir parada';body=selectField('Proveedor de la zona',providers.filter(p=>p.zone===state.zone).map(p=>p.name))+field('Hora estimada','time')+`<div class="drawer-info">Al guardar la ruta se envía el listado completo de paradas, no solo esta parada.</div>`;cta='Añadir al borrador';break;case'new-user':title='Crear usuario';body=field('Nombre completo','text','Nombre y apellidos')+field('Correo electrónico','email','nombre@ecolacteos.pe')+selectField('Rol',['ADMIN','ACOPIADOR','CALIDAD','RECEPCION','PRODUCCION','VENTAS'])+field('Contraseña inicial','password','Mínimo 8 caracteres')+`<div class="drawer-info">Los roles deben poblarse desde GET /api/admin/roles en la implementación.</div>`;cta='Crear usuario';break;case'new-catalog':title=state.catalogTab==='Configuración'?'Editar configuración':`Nuevo registro · ${state.catalogTab}`;body=state.catalogTab==='Configuración'?selectField('Clave',catalogData.Configuración.rows.map(r=>r[0]))+field('Valor nuevo','text','Valor'):field('Nombre o descripción','text','Escribe el valor')+(state.catalogTab==='Unidades'?field('Placa','text','Placa del vehículo')+selectField('Responsable', ['Jorge Palomino','Lidia Espinoza','Martín Córdova'])+selectField('Zona',zones):state.catalogTab==='Tipos de queso'?field('Rendimiento esperado %','number','12.5')+selectField('Ciclo de capital',['RAPIDO','MADURACION']):'')+`<div class="drawer-info">Este formulario muestra la intención de diseño. Los campos definitivos deben alinearse con el DTO de ${catalogData[state.catalogTab].endpoint}.</div>`;break;case'new-price':title='Nueva vigencia de precio';body=field('Precio por litro · S/','number','Ej. 2.40')+field('Vigente desde','date')+`<div class="drawer-info">Una vez registrado, el precio se agrega al histórico. No hay edición ni eliminación desde la API.</div>`;cta='Registrar precio';break;default:return}drawer(title,subtitle,body,cta)}
    function detail(kind,id){let body='',title='Detalle',sub='Información ilustrativa de interfaz.';if(kind==='provider'){let p=providers.find(x=>x.id===id)||providers[0];title=p.name;sub=`${p.id} · ${p.zone}`;body=[['Estado',p.status],['Zona actual',p.zone],['Teléfono',p.phone],['Volumen de muestra',p.liters]].map(x=>`<div class="detail-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+`<div class="section-head"><h2>Historial de zona</h2></div><div class="list-item"><div class="list-dot green">↗</div><div><strong>${p.zone}</strong><p>Asignación actual · consultar GET /api/proveedores/{id}/historial-zona</p></div></div><div class="drawer-info">Desde la implementación, enlaza aquí su historial de acopio y sus pagos por proveedor.</div>`}else if(kind==='payment'){let p=payments.find(x=>x.id===id)||payments[0];title=`Pago ${p.id}`;sub=p.name;body=[['Periodo',p.week],['Litros',p.liters],['Total',p.total],['Comprobante',p.status]].map(x=>`<div class="detail-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+`<div class="section-head"><h2>Registros liquidados</h2></div><p style="font-size:11px;color:var(--muted);line-height:1.6">GET /api/pagos/{id} trae los identificadores de los registros de acopio incluidos. Los ajustes se consultan en GET /api/pagos/{id}/ajustes.</p>`}else if(kind==='communication'){title='Confirmaciones del comunicado';sub='Actualización de horario de recepción';body='<div class="list-item"><div class="list-dot green">✓</div><div><strong>Máximo Quispe Rojas</strong><p>Confirmado por el equipo de acopio · 12 sep 2026</p></div></div><div class="list-item"><div class="list-dot green">✓</div><div><strong>Rosa Huamán Ticse</strong><p>Confirmado por el equipo de acopio · 12 sep 2026</p></div></div><div class="drawer-info">GET /api/comunicados/{id}/confirmaciones es la fuente de esta vista.</div>'}else if(kind==='adjust'){title=`Ajuste ${id}`;sub='Corrección posterior a la liquidación';body='<div class="detail-row"><span>Estado</span><b>Pendiente</b></div><div class="detail-row"><span>Registro de origen</span><b>AC-4821</b></div><div class="drawer-info">La liquidación de un ajuste requiere PATCH /api/pagos/ajustes/{id}/liquidar. Esta vista de diseño no envía la operación.</div><button class="btn primary" data-action="demo-save">Marcar como liquidado</button>'}else if(kind==='catalog'){let row=catalogData[state.catalogTab].rows[Number(id)]||[];title=String(row[0]||'Registro');sub=state.catalogTab;body=row.map((v,i)=>`<div class="detail-row"><span>${catalogData[state.catalogTab].columns[i]}</span><b>${esc(v)}</b></div>`).join('')+`<div class="drawer-info">La edición, desactivación o reactivación usa las rutas reales de ${catalogData[state.catalogTab].endpoint}, según el catálogo.</div>`}else if(kind==='audit'){let row=auditData[state.auditTab].rows[Number(id)]||[];title=String(row[0]||'Registro');sub=`${state.auditTab} · trazabilidad`;body=row.slice(0,-1).map((v,i)=>`<div class="detail-row"><span>${auditData[state.auditTab].columns[i]}</span><b>${esc(v)}</b></div>`).join('')+`<div class="drawer-info">Este detalle enlazará al GET /{id} del recurso correspondiente. Para acopio, puede mostrar correcciones y el análisis por registro.</div>`}else if(kind==='user'){title=['Ana María Torres','Jorge Palomino','Lucía Salazar','Carlos Lazo','Mónica Rojas','Diego Huamán'][Number(id)]||'Usuario';sub='Gestión de acceso';body='<div class="detail-row"><span>Acciones disponibles</span><b>Editar · desactivar · reactivar</b></div><div class="drawer-info">Los permisos se comprueban en el backend en cada petición. Las acciones aquí son solo un ejemplo visual.</div>'}else if(kind==='price'){title='Registro de precio';sub='Vigencia histórica';body=`<div class="detail-row"><span>Vigencia</span><b>${['01 sep 2026','01 jul 2026','01 may 2026','01 mar 2026'][Number(id)]||'—'}</b></div><div class="drawer-info">Un precio anterior permanece consultable; no tiene endpoint de edición o borrado.</div>`}drawer(title,sub,body,'',true)}
    let toastTimer;function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),4000)}
    document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-drawer],[data-detail],[data-tab],[data-move],[data-action]');if(!t)return;if(t.dataset.page){state.page=t.dataset.page;render();window.scrollTo(0,0)}else if(t.dataset.drawer)openForm(t.dataset.drawer);else if(t.dataset.detail){let [kind,id]=t.dataset.detail.split(':');detail(kind,id)}else if(t.dataset.tab){let [kind,val]=t.dataset.tab.split(':');if(kind==='payment')state.paymentTab=val;if(kind==='catalog')state.catalogTab=val;if(kind==='audit')state.auditTab=val;render()}else if(t.dataset.move){let [index,shift]=t.dataset.move.split(':').map(Number),next=index+shift;if(next>=0&&next<state.route.length){[state.route[index],state.route[next]]=[state.route[next],state.route[index]];render()}}else if(t.dataset.action){let a=t.dataset.action;if(a==='close')document.getElementById('portal').innerHTML='';else if(a==='demo-save'){document.getElementById('portal').innerHTML='';toast('Prototipo visual: no se guardaron cambios en el backend.')}else if(a==='save-route')toast('Borrador de ruta listo. El prototipo no envía el PUT al backend.');else if(a==='publish-message'){if(!document.getElementById('message').value.trim())toast('Escribe un mensaje antes de publicar.');else if(!document.querySelector('.zone-check:checked'))toast('Selecciona al menos una zona.');else toast('Comunicado listo para publicar. Este prototipo no envía datos al servidor.')}else if(a==='demo-filter')toast('Filtro de ejemplo: conecta esta acción a los parámetros del GET correspondiente.');else if(a==='page-next'||a==='page-prev')toast('Paginación de ejemplo. Conecta paginaActual y totalPaginas del backend.')}});
    document.addEventListener('change',e=>{let id=e.target.id;if(id==='zone-select'||id==='route-zone'){state.zone=e.target.value;state.route=routeByZone[state.zone];render()}if(id==='provider-zone'){state.providerZone=e.target.value;render()}if(id==='provider-status'){state.providerStatus=e.target.value;render()}});
    document.addEventListener('input',e=>{if(e.target.id==='message')document.getElementById('message-preview').textContent=e.target.value.trim()||'Tu comunicado aparecerá aquí mientras lo escribes.';if(e.target.id==='provider-search'){state.providerSearch=e.target.value;let pos=e.target.selectionStart;render();let search=document.getElementById('provider-search');search.focus();search.setSelectionRange(pos,pos)}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('portal').innerHTML=''});document.getElementById('portal').addEventListener('click',e=>{if(e.target.id==='drawer-overlay')document.getElementById('portal').innerHTML=''});document.getElementById('menu-button').addEventListener('click',()=>document.getElementById('app').classList.toggle('menu-open'));document.getElementById('mobile-overlay').addEventListener('click',()=>document.getElementById('app').classList.remove('menu-open'));document.getElementById('info-button').addEventListener('click',()=>toast('Diseño navegable con datos de ejemplo; no conecta ni modifica el backend.'));document.getElementById('today').textContent='12 sep 2026';render();
  </script>
